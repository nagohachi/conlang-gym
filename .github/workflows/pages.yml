# Build web/ and publish it on GitHub Pages. The model itself is not part of the site: the page
# downloads it from the Hugging Face Hub (VITE_MODEL_URL, see web/README.md).
name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          # onnxruntime-node (used only by local scripts) would otherwise fetch CUDA binaries on Linux.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
      - run: npm run build
        env:
          VITE_MODEL_URL: ${{ vars.VITE_MODEL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
